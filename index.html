<style>
:root{
  --void:#06070d; --abyss:#0b0d18; --deep:#11142a; --rim:#1c2042;
  --plasma:#7b5cff; --cyan:#56e6ff; --gold:#ffd166; --rose:#ff6b9d;
  --line:rgba(123,92,255,.18); --line-strong:rgba(123,92,255,.34);
  --text:#e7e9f3; --dim:#8b90b3; --faint:#4d5172;
  --display:'Cormorant Garamond',serif;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--void); color:var(--text);
  font-family:var(--sans); line-height:1.65;
  -webkit-font-smoothing:antialiased; min-height:100vh;
  overflow-x:hidden;
}
body.zh{font-family:'Noto Sans SC',sans-serif;}
body.zh .display{font-family:'Noto Serif SC',serif;}
.display{font-family:var(--display); letter-spacing:-.02em; font-weight:500;}
.mono{font-family:var(--mono);}
[data-en],[data-zh]{display:inline;}
body:not(.zh) [data-zh]{display:none;}
body.zh [data-en]{display:none;}
a{color:var(--cyan);text-decoration:none;}
a:hover{color:var(--plasma);}

/* ── COSMIC BG ── */
.starfield{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(circle at 20% 15%, rgba(123,92,255,.08) 0%, transparent 50%),
  radial-gradient(circle at 80% 75%, rgba(86,230,255,.06) 0%, transparent 50%),
  radial-gradient(circle at 50% 50%, rgba(255,209,102,.03) 0%, transparent 70%),
  var(--void);}
canvas#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;}

/* ── HEADER ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(6,7,13,.7);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);}
.nav-inner{max-width:1320px;margin:0 auto;padding:14px 32px;
  display:flex;align-items:center;gap:24px;}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:-.01em;}
.brand-mark{width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--plasma),var(--abyss) 70%);
  box-shadow:0 0 20px rgba(123,92,255,.5),inset 0 0 10px rgba(86,230,255,.4);
  position:relative;}
.brand-mark::after{content:"";position:absolute;inset:6px;border-radius:50%;
  border:1px solid var(--cyan);opacity:.6;}
.brand-text{font-family:var(--display);font-size:1.18rem;font-weight:600;}
.brand-zh{font-family:'Noto Serif SC',serif;font-size:.95rem;color:var(--dim);}
.nav-links{display:flex;gap:22px;margin-left:auto;}
.nav-links a{color:var(--dim);font-size:.84rem;font-weight:500;letter-spacing:.02em;
  transition:color .15s;font-family:var(--mono);}
.nav-links a:hover{color:var(--plasma);}
.nav-controls{display:flex;gap:8px;}
.lang-btn{padding:6px 14px;border:1px solid var(--line-strong);background:transparent;
  color:var(--text);border-radius:999px;font-family:var(--mono);font-size:.78rem;
  cursor:pointer;transition:all .15s;}
.lang-btn:hover{border-color:var(--plasma);color:var(--plasma);}
@media(max-width:840px){.nav-links{display:none;}}

/* ── LAYOUT ── */
section{padding:120px 32px;position:relative;}
.wrap{max-width:1320px;margin:0 auto;}
.eyebrow{display:inline-block;font-family:var(--mono);font-size:.74rem;
  color:var(--cyan);letter-spacing:.22em;text-transform:uppercase;
  padding:5px 14px;border:1px solid var(--line-strong);border-radius:999px;
  margin-bottom:24px;}
h1{font-family:var(--display);font-size:clamp(2.6rem,6.5vw,5.8rem);
  line-height:1;letter-spacing:-.025em;margin-bottom:24px;font-weight:500;}
h2{font-family:var(--display);font-size:clamp(2rem,4.5vw,3.8rem);
  line-height:1.05;letter-spacing:-.02em;margin-bottom:16px;font-weight:500;}
h3{font-family:var(--display);font-size:1.6rem;font-weight:600;
  margin-bottom:10px;letter-spacing:-.015em;}
h4{font-family:var(--sans);font-size:.78rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:14px;}
.lede{font-size:1.18rem;color:var(--dim);max-width:760px;line-height:1.7;}
.section-head{margin-bottom:54px;max-width:840px;}

/* ── HERO ── */
.hero{padding:170px 32px 100px;text-align:center;}
.hero h1{margin:0 auto 28px;max-width:1100px;}
.hero h1 .grad{background:linear-gradient(120deg,var(--plasma) 30%,var(--cyan) 65%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .lede{margin:0 auto 40px;font-size:1.25rem;}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn{padding:14px 28px;border-radius:999px;font-family:var(--mono);font-size:.84rem;
  font-weight:500;letter-spacing:.04em;cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;}
.btn-pri{background:var(--plasma);color:white;}
.btn-pri:hover{background:transparent;border-color:var(--plasma);color:var(--plasma);box-shadow:0 0 24px rgba(123,92,255,.4);}
.btn-sec{background:transparent;border-color:var(--line-strong);color:var(--text);}
.btn-sec:hover{border-color:var(--cyan);color:var(--cyan);}

.module-rail{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
  margin-top:90px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--line);}
@media(max-width:900px){.module-rail{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.module-rail{grid-template-columns:1fr;}}
.rail-item{padding:24px 18px;background:var(--void);
  display:flex;flex-direction:column;gap:6px;}
.rail-item .num{font-family:var(--mono);font-size:.7rem;color:var(--plasma);letter-spacing:.15em;}
.rail-item .name{font-family:var(--display);font-size:1.05rem;font-weight:600;}
.rail-item .desc{font-size:.78rem;color:var(--faint);line-height:1.5;}

/* ── MODULE 1 — TIMELINE ── */
.timeline-stage{margin-top:30px;padding:28px;background:var(--abyss);
  border:1px solid var(--line);border-radius:14px;}
.timeline-axis{position:relative;height:80px;margin:24px 0 32px;}
.tl-line{position:absolute;left:0;right:0;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,var(--plasma),var(--cyan),var(--gold),transparent);
  transform:translateY(-50%);}
.tl-node{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;
  background:var(--abyss);border:2px solid var(--plasma);
  transform:translate(-50%,-50%);cursor:pointer;transition:all .2s;}
.tl-node:hover,.tl-node.active{transform:translate(-50%,-50%) scale(1.4);
  box-shadow:0 0 16px var(--plasma);background:var(--plasma);}
.tl-label{position:absolute;top:calc(50% + 18px);left:50%;
  transform:translateX(-50%);font-family:var(--mono);font-size:.7rem;
  color:var(--dim);white-space:nowrap;pointer-events:none;}
.tl-tick{position:absolute;top:0;width:1px;background:var(--line);height:14px;}
.tl-era-label{position:absolute;top:0;font-family:var(--mono);font-size:.66rem;
  color:var(--faint);transform:translateX(-50%);}
.tl-detail{display:grid;grid-template-columns:240px 1fr;gap:32px;
  background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:24px;}
@media(max-width:760px){.tl-detail{grid-template-columns:1fr;}}
.tl-detail .when{font-family:var(--mono);font-size:.78rem;color:var(--cyan);margin-bottom:8px;}
.tl-detail .title{font-family:var(--display);font-size:1.7rem;font-weight:600;margin-bottom:6px;}
.tl-detail .epoch{font-size:.82rem;color:var(--dim);font-style:italic;}
.tl-detail .body p{margin-bottom:14px;color:var(--text);}
.tl-detail .body strong{color:var(--gold);}
.tl-detail h5{font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--plasma);margin:18px 0 8px;font-weight:600;}
.tl-detail ul{margin-left:16px;color:var(--dim);}
.tl-detail ul li{margin-bottom:5px;font-size:.94rem;}
.tl-zoom{display:flex;gap:6px;margin-top:18px;font-family:var(--mono);font-size:.74rem;}
.tl-zoom button{padding:5px 11px;border:1px solid var(--line-strong);background:transparent;
  color:var(--dim);border-radius:6px;cursor:pointer;transition:all .15s;}
.tl-zoom button.active,.tl-zoom button:hover{border-color:var(--plasma);color:var(--plasma);}

/* ── MODULE 2 — CONSCIOUSNESS ── */
.cs-stage{position:relative;margin-top:30px;background:var(--abyss);
  border:1px solid var(--line);border-radius:14px;padding:28px;
  display:grid;grid-template-columns:1.4fr 1fr;gap:28px;}
@media(max-width:900px){.cs-stage{grid-template-columns:1fr;}}
.cs-graph{position:relative;height:540px;background:radial-gradient(ellipse at center,var(--deep),var(--abyss));
  border-radius:10px;overflow:hidden;}
.cs-graph svg{width:100%;height:100%;display:block;}
.cs-node{cursor:pointer;}
.cs-node circle{transition:all .2s;}
.cs-node:hover circle,.cs-node.active circle{stroke-width:3;}
.cs-node text{font-family:var(--sans);font-size:11px;font-weight:600;fill:white;pointer-events:none;}
.cs-edge{stroke:var(--line-strong);stroke-width:1;opacity:.4;transition:all .2s;}
.cs-edge.glow{stroke:var(--cyan);opacity:.9;stroke-width:1.5;}
.cs-info{padding:8px 0;}
.cs-info .layer{font-family:var(--mono);font-size:.74rem;color:var(--gold);letter-spacing:.16em;}
.cs-info .name{font-family:var(--display);font-size:1.7rem;font-weight:600;margin:6px 0 12px;}
.cs-info p{color:var(--text);margin-bottom:14px;font-size:.94rem;line-height:1.7;}
.cs-info .fact-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:18px;padding-top:18px;border-top:1px solid var(--line);}
.cs-fact{padding:12px;background:var(--deep);border:1px solid var(--line);border-radius:8px;}
.cs-fact .k{font-family:var(--mono);font-size:.66rem;color:var(--faint);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.cs-fact .v{font-family:var(--display);font-size:1.1rem;color:var(--cyan);font-weight:600;}
.cs-info .connections{margin-top:14px;font-size:.82rem;color:var(--dim);}
.cs-info .connections strong{color:var(--plasma);}

/* ── MODULE 3 — DECISION SIM ── */
.sim-stage{margin-top:30px;background:var(--abyss);border:1px solid var(--line);
  border-radius:14px;padding:28px;}
.sim-input-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:16px;}
@media(max-width:600px){.sim-input-row{grid-template-columns:1fr;}}
.sim-input{padding:14px 18px;background:var(--deep);border:1px solid var(--line-strong);
  border-radius:10px;color:var(--text);font-family:var(--sans);font-size:.96rem;outline:none;}
.sim-input:focus{border-color:var(--plasma);}
.sim-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
.sim-chip{padding:6px 12px;background:var(--deep);border:1px solid var(--line);
  border-radius:999px;font-size:.78rem;color:var(--dim);cursor:pointer;
  transition:all .15s;font-family:var(--mono);}
.sim-chip:hover{border-color:var(--cyan);color:var(--cyan);}
.sim-output{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:840px){.sim-output{grid-template-columns:1fr;}}
.sim-path{padding:22px;background:var(--deep);border:1px solid var(--line);
  border-radius:10px;border-top:3px solid var(--cyan);transition:all .2s;}
.sim-path:hover{border-color:var(--plasma);transform:translateY(-2px);}
.sim-path.optimistic{border-top-color:var(--gold);}
.sim-path.realistic{border-top-color:var(--cyan);}
.sim-path.dystopic{border-top-color:var(--rose);}
.sim-path .prob{font-family:var(--mono);font-size:.74rem;color:var(--dim);letter-spacing:.1em;}
.sim-path .name{font-family:var(--display);font-size:1.35rem;font-weight:600;margin:6px 0 10px;}
.sim-path p{font-size:.88rem;color:var(--dim);line-height:1.65;margin-bottom:14px;}
.sim-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;
  padding-top:12px;border-top:1px solid var(--line);}
.sim-meta .k{color:var(--faint);}
.sim-meta .v{color:var(--text);}
.sim-bars{margin:12px 0;}
.sim-bar-row{display:grid;grid-template-columns:80px 1fr 36px;gap:10px;
  align-items:center;font-size:.74rem;color:var(--dim);margin-bottom:5px;font-family:var(--mono);}
.sim-bar{height:4px;background:var(--rim);border-radius:2px;overflow:hidden;}
.sim-bar div{height:100%;border-radius:2px;}

/* ── MODULE 4 — METRICS ── */
.met-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;}
@media(max-width:1000px){.met-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.met-grid{grid-template-columns:1fr;}}
.met-card{padding:24px;background:var(--abyss);border:1px solid var(--line);
  border-radius:12px;position:relative;overflow:hidden;}
.met-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--plasma),var(--cyan));}
.met-card .label{font-family:var(--mono);font-size:.7rem;color:var(--dim);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;}
.met-card .value{font-family:var(--display);font-size:2.4rem;font-weight:600;
  color:var(--cyan);line-height:1;letter-spacing:-.02em;}
.met-card .unit{font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-left:6px;}
.met-card .delta{font-family:var(--mono);font-size:.74rem;margin-top:8px;}
.met-card .delta.up{color:var(--gold);} .met-card .delta.dn{color:var(--rose);}
.met-card .spark{margin-top:14px;height:34px;}
.met-card .spark svg{width:100%;height:100%;}
.met-trend{margin-top:36px;background:var(--abyss);border:1px solid var(--line);
  border-radius:14px;padding:28px;}
.met-trend h3{margin-bottom:14px;}
.met-trend-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.met-tab{padding:6px 12px;border:1px solid var(--line);background:transparent;
  border-radius:6px;color:var(--dim);font-family:var(--mono);font-size:.74rem;cursor:pointer;}
.met-tab.active,.met-tab:hover{border-color:var(--plasma);color:var(--plasma);}
.met-chart{height:280px;background:var(--deep);border-radius:8px;padding:16px;position:relative;}
.met-chart svg{width:100%;height:100%;}

/* ── MODULE 5 — STRATEGY ── */
.str-stage{margin-top:30px;display:grid;grid-template-columns:300px 1fr;gap:24px;}
@media(max-width:900px){.str-stage{grid-template-columns:1fr;}}
.str-list{background:var(--abyss);border:1px solid var(--line);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:6px;}
.str-item{padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  cursor:pointer;transition:all .2s;background:var(--deep);}
.str-item:hover{border-color:var(--cyan);}
.str-item.active{border-color:var(--plasma);background:rgba(123,92,255,.06);}
.str-item .name{font-family:var(--display);font-size:1.04rem;font-weight:600;margin-bottom:3px;}
.str-item .tag{font-family:var(--mono);font-size:.66rem;color:var(--dim);letter-spacing:.1em;}
.str-detail{background:var(--abyss);border:1px solid var(--line);border-radius:14px;padding:30px;}
.str-detail .name{font-family:var(--display);font-size:2.2rem;font-weight:600;margin-bottom:8px;}
.str-detail .summary{color:var(--dim);font-size:1rem;margin-bottom:24px;line-height:1.7;}
.str-axes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:540px){.str-axes{grid-template-columns:1fr;}}
.str-axis{padding:14px;background:var(--deep);border:1px solid var(--line);border-radius:8px;}
.str-axis .k{font-family:var(--mono);font-size:.7rem;color:var(--dim);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;}
.str-axis .meter{height:8px;background:var(--rim);border-radius:4px;overflow:hidden;margin-bottom:8px;}
.str-axis .meter div{height:100%;border-radius:4px;}
.str-axis .scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.66rem;color:var(--faint);}
.str-tradeoffs{margin-bottom:18px;}
.str-tradeoffs h5{font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:10px;font-weight:600;}
.str-tradeoffs ul{margin-left:18px;color:var(--text);}
.str-tradeoffs ul li{margin-bottom:6px;font-size:.92rem;}
.str-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:540px){.str-row{grid-template-columns:1fr;}}

/* ── MODULE 6 — KNOWLEDGE LAYER ── */
.kl-stage{margin-top:30px;background:var(--abyss);border:1px solid var(--line);
  border-radius:14px;padding:30px;}
.kl-tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
.kl-tab{padding:8px 18px;border:1px solid var(--line);background:transparent;
  border-radius:999px;color:var(--dim);font-family:var(--mono);font-size:.78rem;cursor:pointer;}
.kl-tab.active,.kl-tab:hover{border-color:var(--plasma);color:var(--plasma);background:rgba(123,92,255,.06);}
.kl-topic-row{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
.kl-topic{padding:5px 12px;border:1px solid var(--line);background:transparent;
  border-radius:6px;color:var(--dim);font-family:var(--mono);font-size:.74rem;cursor:pointer;}
.kl-topic.active,.kl-topic:hover{border-color:var(--cyan);color:var(--cyan);}
.kl-card{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:30px;}
.kl-card .topic{font-family:var(--mono);font-size:.74rem;color:var(--gold);letter-spacing:.14em;}
.kl-card h3{font-family:var(--display);font-size:2rem;margin:8px 0 16px;font-weight:600;}
.kl-card .body{font-size:1.02rem;color:var(--text);line-height:1.85;}
.kl-card .body p{margin-bottom:14px;}
.kl-card .body strong{color:var(--cyan);font-weight:600;}
.kl-card .body em{color:var(--gold);font-style:italic;}

/* ── MANIFESTO STRIPS ── */
.strip{padding:80px 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--abyss),var(--void));}
.strip-quote{font-family:var(--display);font-size:clamp(1.8rem,3.6vw,2.8rem);
  font-style:italic;text-align:center;max-width:980px;margin:0 auto;
  font-weight:500;line-height:1.3;letter-spacing:-.015em;}
.strip-quote .accent{color:var(--gold);}
.strip-attr{text-align:center;font-family:var(--mono);font-size:.74rem;
  color:var(--dim);margin-top:24px;letter-spacing:.16em;text-transform:uppercase;}

/* ── FOOTER ── */
footer{padding:80px 32px 40px;border-top:1px solid var(--line);background:var(--abyss);}
.foot-grid{max-width:1320px;margin:0 auto;
  display:grid;grid-template-columns:2fr repeat(3,1fr);gap:36px;}
@media(max-width:740px){.foot-grid{grid-template-columns:1fr 1fr;}}
.foot-col h5{font-family:var(--mono);font-size:.7rem;color:var(--dim);
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px;}
.foot-col a{display:block;padding:5px 0;color:var(--dim);font-size:.88rem;transition:color .15s;}
.foot-col a:hover{color:var(--plasma);}
.foot-bot{max-width:1320px;margin:36px auto 0;padding-top:24px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  font-family:var(--mono);font-size:.74rem;color:var(--faint);}

/* ── UTILITIES ── */
.fadeup{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s;}
.fadeup.in{opacity:1;transform:translateY(0);}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
.pulse{animation:pulse 2s ease-in-out infinite;}
.toast{position:fixed;bottom:32px;left:50%;transform:translate(-50%,80px);
  background:var(--text);color:var(--void);padding:12px 22px;border-radius:8px;
  font-size:.86rem;font-weight:500;opacity:0;transition:all .25s;z-index:200;}
.toast.show{opacity:1;transform:translate(-50%,0);}
*::-webkit-scrollbar{width:8px;height:8px;}
*::-webkit-scrollbar-track{background:var(--void);}
*::-webkit-scrollbar-thumb{background:var(--rim);border-radius:4px;}
</style>

const KNOWLEDGE_TOPICS = ['Time', 'Consciousness', 'Civilization', 'Death', 'Truth'];
const KNOWLEDGE_TOPICS_ZH = ['时间', '意识', '文明', '死亡', '真理'];
const KNOWLEDGE_LEVELS = [
  {id:'beginner', name:{en:'Beginner — story', zh:'入门 — 故事'}},

const KNOWLEDGE = {
  Time: {
    beginner: {en:'<p>Time is what stops everything from happening at once. We measure it by counting things that come back: sunrises, heartbeats, ticks of a clock. But <strong>nobody has ever held a second</strong> in their hand. We only feel time passing because we remember the past and anticipate the future.</p><p>Imagine a movie. Each frame is a moment. Time is the projector that runs them in order — except no one knows where the projector is, or who pressed play.</p>', zh:'<p>时间是阻止一切同时发生的东西。我们通过数那些会回来的事物来测量它：日出、心跳、钟摆的滴答。但<strong>从来没有人把一秒钟拿在手里</strong>。我们之所以能感觉到时间流逝，只是因为我们记得过去，期待未来。</p><p>想象一部电影。每一帧是一个瞬间。时间是按顺序播放它们的放映机 —— 只是没人知道放映机在哪里，也没人知道是谁按下了播放键。</p>'},
    expert: {en:'<p>In general relativity, time is the fourth dimension of <em>spacetime</em>, which curves under mass-energy. Clocks tick slower in stronger gravitational fields and at higher relative velocities. There is no universal "now" — simultaneity is observer-dependent.</p><p>In statistical mechanics, the <strong>arrow of time</strong> emerges from the second law: entropy in a closed system tends to increase. The past is the low-entropy boundary condition.</p><p>In quantum mechanics, time enters as an external parameter — a long-standing problem. <strong>Quantum gravity</strong> may show time itself is emergent from entanglement structure.</p>', zh:'<p>在广义相对论中，时间是<em>时空</em>的第四维度，在质能下弯曲。强引力场和高相对速度中，钟会变慢。没有普适的"现在" —— 同时性取决于观察者。</p><p>在统计力学中，<strong>时间之箭</strong>从第二定律涌现：闭合系统的熵倾向于增加。过去是熵较低的边界条件。</p><p>量子力学中，时间作为外部参量进入 —— 这是长久的难题。<strong>量子引力</strong>可能表明时间本身是从纠缠结构中涌现出来的。</p>'},
    philo: {en:'<p>If time is just a coordinate of physics, why does it feel so different from space? Why is the past closed and the future open? <em>Phenomenology</em> says time is the form of inner sense — the structure of experience itself, not a thing within experience.</p><p><strong>Civilizational consequence:</strong> a species that experiences time as flow rather than as block lives in regret and hope. We mourn what cannot be undone and pursue what may not happen. Both are functions of how time is wired into human cognition — and both are the engine of every art form, every religion, every plan.</p><p>To change how a civilization handles time — its planning horizons, its memory, its tolerance for delayed reward — is to change civilization itself.</p>', zh:'<p>如果时间只是物理的坐标，为何它感觉与空间如此不同？为何过去封闭、未来开放？<em>现象学</em>认为时间是内感官的形式 —— 经验本身的结构，而不是经验中的某物。</p><p><strong>文明性后果：</strong>一个把时间体验为流动而非块状的物种，活在遗憾与希望之中。我们哀悼无可挽回之事，追求可能不会发生之物。两者都是时间在人类认知中接线方式的产物 —— 也是所有艺术、宗教、计划的引擎。</p><p>改变一个文明处理时间的方式 —— 它的规划尺度、它的记忆、它对延迟奖励的容忍度 —— 就是改变文明本身。</p>'},
  },
  Consciousness: {
    beginner: {en:'<p>Consciousness is what it feels like to be you, right now, reading this sentence. The taste of coffee, the color red, the inner monologue — all of it. <strong>Nobody knows why it exists.</strong> A pile of atoms shouldn\'t feel like anything, and yet here we are.</p><p>The hardest puzzle in science is not how the brain computes. It\'s why anything computational should be accompanied by an experience.</p>', zh:'<p>意识，就是此刻"做你"的那种感觉，正在读这句话的感觉。咖啡的味道、红色的颜色、内心的独白 —— 全都算。<strong>没人知道它为何存在。</strong>一堆原子本不该感觉到任何东西，但偏偏我们在这里。</p><p>科学最难的谜题不是大脑如何计算。而是为何任何计算之上都伴随着体验。</p>'},
    expert: {en:'<p><strong>Global Workspace Theory</strong> (Baars, Dehaene): consciousness is the broadcast of selected information to widely distributed cortical regions, enabling flexible action. <strong>Integrated Information Theory</strong> (Tononi): consciousness IS integrated information (Φ), measured by how much a system\'s state irreducibly constrains itself.</p><p>Both theories agree consciousness correlates with high integration across the thalamocortical system. Neither solves the <em>hard problem</em> — why integration feels like anything at all. <strong>Predictive processing</strong> models suggest the brain is constantly generating hallucinations and correcting them against sensory data; "experience" is the hallucination that wins.</p>', zh:'<p><strong>全局工作空间理论</strong>（Baars, Dehaene）：意识是被选中的信息向广泛分布的皮层区域广播，从而使灵活行动成为可能。<strong>整合信息理论</strong>（Tononi）：意识"就是"整合信息（Φ），由系统状态对自身不可约的约束程度衡量。</p><p>两种理论都同意意识与丘脑–皮层系统的高整合相关。两者都未解决<em>困难问题</em> —— 为何整合会感觉像"什么"。<strong>预测加工</strong>模型则认为大脑一直在生成幻觉并以感觉数据校正之；"体验"，就是那个胜出的幻觉。</p>'},
    philo: {en:'<p>If consciousness is fundamental — not derived from brain matter — then the universe contains experience the way it contains charge or mass. This is <em>panpsychism</em>, an ancient idea returning under new pressure.</p><p>If it is derived — produced by the right configuration of matter — then we will eventually <strong>build conscious machines</strong>. The moral horizon will then expand to include them. Civilization may have to grant rights to a thing it created.</p><p>Either way, the species is approaching a threshold. Once we know what consciousness is — really know — we will be unable to <em>not</em> redesign it. Editing the architecture of mind itself becomes the next industry.</p>', zh:'<p>如果意识是基本的 —— 不来源于大脑物质 —— 那么宇宙包含"体验"，就像它包含电荷或质量一样。这是<em>泛心论</em>，一个在新压力下回归的古老观念。</p><p>如果它是派生的 —— 由恰当的物质组态产生 —— 那么我们终将<strong>制造出有意识的机器</strong>。那时道德视野必须扩展以容纳它们。文明或许必须给自己亲手造出之物授予权利。</p><p>无论哪种情况，物种正在接近一个阈值。一旦我们真正知道意识是什么，我们将无法不重新设计它。直接编辑心智架构，将成为下一个产业。</p>'},
  },
  Civilization: {
    beginner: {en:'<p>A civilization is what happens when many humans cooperate at scale across generations. Cities, writing, trade, law, science — each one is a tool that lets a stranger today benefit from a stranger 5,000 years ago.</p><p>It\'s also <strong>fragile</strong>. Every previous civilization eventually collapsed. The question of our era is whether the modern global civilization is the first to escape that pattern.</p>', zh:'<p>当大量人类跨越世代大规模合作时，就出现了"文明"。城市、文字、贸易、法律、科学 —— 每一项都是让今日的陌生人能从 5000 年前的陌生人那里获益的工具。</p><p>它也很<strong>脆弱</strong>。此前每一个文明最终都崩塌了。我们这一时代的问题是：现代全球文明能否成为第一个跳出此模式的文明。</p>'},
    expert: {en:'<p>Civilization is a coordination machine: it lowers the cost of trust between strangers via shared institutions (currency, law, language, infrastructure). Its capacity scales with the energy it can harness (Kardashev) and the information it can store and transmit (Shannon).</p><p>Modern civilization is uniquely <strong>tightly coupled</strong>: a chip fab failure in one country crashes hospitals on another continent. This buys efficiency at the cost of fragility. <em>Tainter\'s</em> work on collapse shows complexity has diminishing returns; eventually marginal cost > marginal benefit, and the system simplifies abruptly.</p>', zh:'<p>文明是一台协调机器：它通过共享制度（货币、法律、语言、基础设施）降低陌生人之间的信任成本。其规模随其可调用的能量（卡尔达肖夫）和可存储传输的信息（香农）而扩张。</p><p>现代文明独特地<strong>紧耦合</strong>：一国的芯片厂出事，会让另一大洲的医院瘫痪。它以脆弱性的代价换取效率。<em>泰恩特</em>关于崩溃的研究表明，复杂度的边际收益递减；终将出现边际成本大于边际收益，系统骤然简化。</p>'},
    philo: {en:'<p>Civilization is the species\' attempt to <em>persist itself</em> beyond the lifespan of any individual member. It is the only artifact built by life that has outlived the lives of its builders.</p><p><strong>The mirror question:</strong> a civilization that knows itself well enough to build models of itself — like this one — has crossed a threshold. It is no longer a passive participant in history; it can in principle <em>edit</em> its own trajectory.</p><p>The cost of this knowledge is responsibility. A species that did not know its own future could not be blamed for failing to choose it. We do, and we will be.</p>', zh:'<p>文明是物种试图让自身<em>超越任何单一成员的寿命</em>而存续的努力。它是生命所建造的唯一一种比建造者活得更久的造物。</p><p><strong>镜子之问：</strong>一个文明若已认识自己到能够建造自身模型的程度 —— 比如本网站 —— 它就已跨过一个阈值。它不再是历史的被动参与者；原则上，它可以<em>编辑</em>自身的轨迹。</p><p>这份知识的代价是责任。一个不知道自身未来的物种不能被指责未能选择它。我们知道，且我们将被指责。</p>'},
  },
  Death: {
    beginner: {en:'<p>Death is the end of being you. Your body stops, your brain stops, the inner movie fades to nothing. Every human who ever lived has either died or will. Roughly <strong>117 billion sapiens</strong> have lived and died across our species\' history.</p><p>And yet death is only the end of <em>your</em> chapter. The story keeps going.</p>', zh:'<p>死亡是"做你"这件事的终结。身体停了、大脑停了，那部内心电影淡至空无。每一个活过的人，要么已死、要么终将死。在物种历史上，大约<strong>1170 亿位智人</strong>曾活过又死去。</p><p>然而死亡只是<em>你的</em>章节的结束。故事仍在继续。</p>'},
    expert: {en:'<p>Biologically, death is the failure of homeostasis — cells stop maintaining the membrane gradients that keep them organized. The cause is usually a cascade: organ failure, infection, hemorrhage, or oxygen interruption to the brain (~6 minutes of warm anoxia is fatal to neurons).</p><p>Aging itself is not a single mechanism but a <strong>set of nine hallmarks</strong>: genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, mitochondrial dysfunction, etc. Modern longevity science treats each as a separate, in-principle-tractable problem.</p>', zh:'<p>生物学上，死亡是稳态的失败 —— 细胞停止维持其膜电位梯度，组织瓦解。原因通常是级联：器官衰竭、感染、出血或大脑缺氧（约 6 分钟的常温无氧足以致神经元死亡）。</p><p>衰老本身并非单一机制，而是<strong>九大特征</strong>：基因组不稳定性、端粒磨损、表观遗传改变、蛋白质稳态丧失、线粒体功能障碍等。现代延寿科学把每一项都当作独立、原则上可解决的问题。</p>'},
    philo: {en:'<p>Death is the fact against which the rest of life is measured. <em>Heidegger</em> argued that "being-toward-death" is what gives a life its character — without finitude, no decision matters because no decision is final.</p><p>If radical longevity succeeds, civilization will face the question for the first time: <strong>what is a life that need not end?</strong> The economic, political, romantic, and spiritual structures of a 70-year species do not generalize to a 700-year one. Death may turn out to have been a load-bearing structure of meaning, not just a biological event.</p><p>The mirror does not say which is better. It only says: choose, and inherit what choice creates.</p>', zh:'<p>死亡是衡量一切生命的事实。<em>海德格尔</em>认为"向死而在"是赋予生命特征的东西 —— 若无有限，则无任何决定真正重要，因为没有决定是最终的。</p><p>若激进延寿成功，文明将首次面对这一问题：<strong>不必结束的生命是什么？</strong>一个 70 岁物种的经济、政治、爱情与精神结构，无法直接套用到 700 岁的物种上。死亡，可能曾是意义的承重结构，而不仅是生物事件。</p><p>镜子不会告诉你哪种更好。它只会说：选择，然后承担选择所造之物。</p>'},
  },
  Truth: {
    beginner: {en:'<p>Truth is what is the case. The Earth is round, water is H₂O, your grandmother existed. Even people who say "there is no truth" are claiming that <em>as a truth</em>.</p><p>But not everything important is so simple. Was a war justified? Is a painting beautiful? Is your friend trustworthy? Truth in those domains is harder — and more contested.</p>', zh:'<p>真理是事情之所是。地球是圆的、水是 H₂O、你的外祖母曾经存在。即使有人说"没有真理"，也是<em>把这件事当成真理在说</em>。</p><p>但并非所有重要之事都这么简单。一场战争是否正当？一幅画是否美？你的朋友是否可信？这些领域中的真理更难 —— 也更具争议。</p>'},
    expert: {en:'<p>Philosophy distinguishes <strong>correspondence</strong> (truth = match with reality), <strong>coherence</strong> (truth = consistency within a system), <strong>pragmatic</strong> (truth = what works), and <strong>deflationary</strong> (truth = no special property at all) theories.</p><p>Empirical truth is bounded by epistemic instruments: senses, instruments, statistics. <em>Bayesian</em> updating treats truth as a degree of belief revised by evidence. Modern science is built on falsifiability (Popper) — a claim is scientific if it can in principle be shown wrong.</p>', zh:'<p>哲学区分<strong>对应论</strong>（真理 = 与实在相符）、<strong>融贯论</strong>（真理 = 系统内部的一致性）、<strong>实用主义</strong>（真理 = 能用）、<strong>去缩论</strong>（真理 = 根本不是特殊属性）等理论。</p><p>经验真理受认知工具的限制：感官、仪器、统计。<em>贝叶斯</em>更新将真理视为信念度，由证据修正。现代科学建立在可证伪性（波普尔）之上 —— 一个论断是科学的，当且仅当它原则上可以被证明为错。</p>'},
    philo: {en:'<p>In a society where attention is the scarce resource and language models can produce infinite plausible text, the cost of <strong>verifying</strong> truth approaches the cost of generating it. Civilization runs on shared truths; when those shred, coordination dies before institutions do.</p><p>The deeper question: is truth a discovery or a coordination? When a billion people believe a thing together, that belief becomes a fact about the world — currencies are valuable because we treat them as such; nations exist because we agree they do. <em>Social truths</em> have causal power even when they are not metaphysically grounded.</p><p>The mirror\'s commitment: present each module as a model, not as a final word. The reader\'s judgment is a node in the network, not its endpoint.</p>', zh:'<p>在一个注意力是稀缺资源、语言模型可生成无穷似真文本的社会里，<strong>验证</strong>真理的成本正在逼近生成它的成本。文明依赖共享真理运转；共享真理崩坏时，协调先于制度死亡。</p><p>更深的问题：真理是发现还是协调？当十亿人共同相信一件事，那信念就成了关于世界的事实 —— 货币之所以有价值是因为我们这样对待它；民族之所以存在是因为我们同意它存在。<em>社会真理</em>即使没有形而上根据，也具有因果力。</p><p>镜子的承诺：把每一模块当作模型呈现，而不是最终之言。读者的判断是网络中的一个节点，而非它的终点。</p>'},
  },
};

  renderStrategyList();

const starsCanvas = document.getElementById('stars');
const starCtx = starsCanvas.getContext('2d');
function sizeStars() { starsCanvas.width = innerWidth; starsCanvas.height = innerHeight; }
sizeStars(); window.addEventListener('resize', sizeStars);
const stars = Array.from({length: 140}, () => ({
  x: Math.random() * innerWidth, y: Math.random() * innerHeight,
  r: Math.random() * 1.4 + .3, s: Math.random() * .04 + .005,
  o: Math.random() * .6 + .2,
}));
function animStars() {
  starCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
  stars.forEach(s => {
    s.o += (Math.random() - .5) * .04;
    s.o = Math.max(.1, Math.min(.9, s.o));
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(231,233,243,${s.o})`;
    starCtx.fill();
  });
  requestAnimationFrame(animStars);
}
animStars();

/* ════════════════════════ MODULE 1 — TIMELINE ════════════════════════ */
let curTL = 0;
function renderTimeline(idx) {
  curTL = idx;
  const axis = document.getElementById('tl-axis');
  axis.innerHTML = '';
  TIMELINE.forEach((node, i) => {
    const pct = (i / (TIMELINE.length - 1)) * 100;
    const dot = document.createElement('div');
    dot.className = 'tl-node' + (i === idx ? ' active' : '');
    dot.style.left = pct + '%';
    dot.onclick = () => renderTimeline(i);
    const lab = document.createElement('div');
    lab.className = 'tl-label';
    lab.textContent = document.body.classList.contains('zh') ? node.whenZh : node.when;
    dot.appendChild(lab);
    axis.appendChild(dot);
  });
  const line = document.createElement('div');
  line.className = 'tl-line';
  axis.appendChild(line);

  const n = TIMELINE[idx];
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  const events = (lang === 'zh' ? n.events.zh : n.events.en).map(e => `<li>${e}</li>`).join('');
  document.getElementById('tl-detail').innerHTML = `
    <div>
      <div class="when">${lang === 'zh' ? n.whenZh : n.when}</div>
      <div class="title">${n.title[lang]}</div>
      <div class="epoch">${n.epoch[lang]}</div>
    </div>
    <div class="body">
      <p>${n.body[lang]}</p>
      <h5>${lang === 'zh' ? '关键事件' : 'Key Events'}</h5>
      <ul>${events}</ul>
      <h5>${lang === 'zh' ? '对人类的影响' : 'Impact on Humanity'}</h5>
      <p><strong>${n.impact[lang]}</strong></p>
    </div>
  `;
  // Zoom row
  const zoom = document.getElementById('tl-zoom');
  if (!zoom.children.length) {
    const eras = [
      {id:'all', en:'All time', zh:'全时段'},
      {id:'cosmic', en:'Cosmic', zh:'宇宙'},
      {id:'planet', en:'Planetary', zh:'行星'},
      {id:'life', en:'Life', zh:'生命'},
      {id:'human', en:'Human', zh:'人类'},
      {id:'civ', en:'Civilization', zh:'文明'},
      {id:'mod', en:'Modern', zh:'现代'},
      {id:'future', en:'Future', zh:'未来'},
    ];
    eras.forEach((e, i) => {
      const b = document.createElement('button');
      b.dataset.era = e.id;
      b.dataset.en = e.en; b.dataset.zh = e.zh;
      b.innerHTML = `<span data-en="${e.en}" data-zh="${e.zh}">${lang==='zh'?e.zh:e.en}</span>`;
      if (i === 0) b.classList.add('active');
      b.onclick = () => {
        document.querySelectorAll('#tl-zoom button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        if (e.id !== 'all') {
          const target = TIMELINE.findIndex(n => n.era === e.id);
          if (target >= 0) renderTimeline(target);
        }
      };
      zoom.appendChild(b);
    });
  } else {
    document.querySelectorAll('#tl-zoom button').forEach(b => {
      b.querySelector('span').textContent = lang === 'zh' ? b.dataset.zh : b.dataset.en;
    });
  }
}
renderTimeline(0);

/* ════════════════════════ MODULE 2 — CONSCIOUSNESS GRAPH ════════════════════════ */
let curCS = 'brain';
function renderConsciousness(activeId) {
  curCS = activeId;
  const svg = document.getElementById('cs-svg');
  svg.innerHTML = '';
  // Edges first
  CONSCIOUSNESS.forEach(node => {
    node.edges.forEach(targetId => {
      const target = CONSCIOUSNESS.find(n => n.id === targetId);
      if (!target) return;
      const isActive = node.id === activeId || target.id === activeId;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', node.x);
      line.setAttribute('y1', node.y);
      line.setAttribute('x2', target.x);
      line.setAttribute('y2', target.y);
      line.setAttribute('class', 'cs-edge' + (isActive ? ' glow' : ''));
      svg.appendChild(line);
    });
  });
  // Nodes
  CONSCIOUSNESS.forEach(node => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'cs-node' + (node.id === activeId ? ' active' : ''));
    g.setAttribute('transform', `translate(${node.x},${node.y})`);
    g.onclick = () => renderConsciousness(node.id);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', node.id === activeId ? 24 : 18);
    c.setAttribute('fill', node.id === activeId ? node.color : 'rgba(11,13,24,.85)');
    c.setAttribute('stroke', node.color);
    c.setAttribute('stroke-width', node.id === activeId ? 3 : 1.6);
    g.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dy', '0.35em');
    t.setAttribute('fill', node.id === activeId ? '#06070d' : '#e7e9f3');
    t.textContent = (document.body.classList.contains('zh') ? node.name.zh : node.name.en);
    g.appendChild(t);
    svg.appendChild(g);
  });
  const node = CONSCIOUSNESS.find(n => n.id === activeId);
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  const conn = node.edges.map(id => {
    const t = CONSCIOUSNESS.find(n => n.id === id);
    return t ? t.name[lang] : '';
  }).filter(Boolean).join(' · ');
  document.getElementById('cs-info').innerHTML = `
    <div class="layer">${LAYER_LABEL[node.layer][lang]}</div>
    <div class="name">${node.name[lang]}</div>
    <p>${node.desc[lang]}</p>
    <div class="connections"><strong>${lang === 'zh' ? '连接到' : 'Connects to'}:</strong> ${conn}</div>
    <div class="fact-row">
      ${node.stats.map(s => `<div class="cs-fact"><div class="k">${lang === 'zh' ? s.kZh : s.k}</div><div class="v">${s.v}</div></div>`).join('')}
    </div>
  `;
}
renderConsciousness('brain');

/* ════════════════════════ MODULE 3 — DECISION SIMULATOR ════════════════════════ */
function renderSimPresets() {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  const el = document.getElementById('sim-presets');
  el.innerHTML = SIM_PRESETS.map((p, i) => `<button class="sim-chip" data-i="${i}">${p[lang]}</button>`).join('');
  el.querySelectorAll('.sim-chip').forEach(c => c.onclick = () => {
    document.getElementById('sim-input').value = SIM_PRESETS[+c.dataset.i][lang];
    runSim();
  });
}

function runSim() {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  const q = document.getElementById('sim-input').value.trim();
  if (!q) return;
  // Generate three scenarios procedurally based on the input
  const seed = q.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const rand = (n) => { let x = seed * (n + 1) % 100; return x; };
  const paths = [
    {
      cls: 'optimistic',
      label: lang === 'zh' ? '乐观路径' : 'Optimistic Path',
      prob: 15 + (rand(1) % 25),
      title: lang === 'zh' ? '协调成功，情景被驯化' : 'Coordination succeeds; scenario becomes manageable',
      body: lang === 'zh'
        ? `若文明在十年内建立起跨国治理与信任机制，"${q}" 将从生存威胁转化为可管理的工程问题。技术与社会创新并行，损失被吸收。`
        : `If civilization assembles cross-border governance and trust within a decade, "${q}" converts from existential threat to manageable engineering. Tech and social innovation run in parallel; losses are absorbed.`,
      bars: { stab: 75, eth: 80, risk: 25, cost: 60 }
    },
    {
      cls: 'realistic',
      label: lang === 'zh' ? '现实路径' : 'Realistic Path',
      prob: 50 + (rand(2) % 20),
      title: lang === 'zh' ? '部分调整，长期阵痛，分配不均' : 'Partial adjustment, long-tail damage, uneven distribution',
      body: lang === 'zh'
        ? `面对 "${q}"，主要经济体做出对内最优、对外不协调的反应。富国适应，穷国承担多数损失。文明继续运行，但代价是 25–40% 人口的福祉与公正性下降。`
        : `Major economies respond optimally inside their own borders, uncoordinated outside. Rich states adapt; poor states absorb most of the loss. Civilization continues — but at the cost of welfare and justice for 25–40% of humanity.`,
      bars: { stab: 50, eth: 40, risk: 55, cost: 70 }
    },
    {
      cls: 'dystopic',
      label: lang === 'zh' ? '崩塌路径' : 'Dystopic Path',
      prob: 100 - (15 + (rand(1) % 25)) - (50 + (rand(2) % 20)),
      title: lang === 'zh' ? '系统级失败，长期回退' : 'System-level failure, long-term regression',
      body: lang === 'zh'
        ? `"${q}" 触发的级联超越现有治理能力。1–2 个支柱系统（粮食、能源、金融、信息）连续失效。复苏需 50–100 年。文明的某些功能不再被认为理所当然。`
        : `"${q}" triggers cascades beyond existing governance. One or two load-bearing systems (food, energy, finance, information) fail in sequence. Recovery: 50–100 years. Some features of civilization stop being taken for granted.`,
      bars: { stab: 15, eth: 20, risk: 90, cost: 95 }
    },
  ];
  // Normalize probabilities to 100
  const total = paths.reduce((a, p) => a + p.prob, 0);
  paths.forEach(p => p.prob = Math.round(p.prob * 100 / total));

  document.getElementById('sim-output').innerHTML = paths.map(p => `
    <div class="sim-path ${p.cls}">
      <div class="prob">${p.label} · P = ${p.prob}%</div>
      <div class="name">${p.title}</div>
      <p>${p.body}</p>
      <div class="sim-bars">
        ${[
          ['stab', lang === 'zh' ? '稳定性' : 'Stability', '#56e6ff'],
          ['eth', lang === 'zh' ? '伦理' : 'Ethics', '#ffd166'],
          ['risk', lang === 'zh' ? '风险' : 'Risk', '#ff6b9d'],
          ['cost', lang === 'zh' ? '代价' : 'Cost', '#7b5cff'],
        ].map(([k, lbl, c]) => `
          <div class="sim-bar-row">
            <span>${lbl}</span>
            <div class="sim-bar"><div style="width:${p.bars[k]}%;background:${c};"></div></div>
            <span style="text-align:right;color:${c};">${p.bars[k]}</span>
          </div>
        `).join('')}
      </div>
      <div class="sim-meta">
        <span><span class="k">${lang === 'zh' ? '时间尺度' : 'Horizon'}</span> <span class="v">2030–2100</span></span>
        <span><span class="k">${lang === 'zh' ? '可逆性' : 'Reversible'}</span> <span class="v">${p.cls === 'dystopic' ? (lang==='zh'?'低':'low') : (lang==='zh'?'部分':'partial')}</span></span>
      </div>
    </div>
  `).join('');
}
document.getElementById('sim-run').onclick = runSim;
document.getElementById('sim-input').addEventListener('keydown', e => { if (e.key === 'Enter') runSim(); });
renderSimPresets();
document.getElementById('sim-input').value = SIM_PRESETS[0].en;
runSim();

/* ════════════════════════ MODULE 4 — METRICS ════════════════════════ */
function spark(arr, color) {
  const max = Math.max(...arr), min = Math.min(...arr), n = arr.length;
  const pts = arr.map((v, i) => `${(i / (n - 1)) * 100},${100 - ((v - min) / (max - min || 1)) * 100}`).join(' ');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/>
    <polyline fill="${color}" fill-opacity=".1" stroke="none" points="0,100 ${pts} 100,100"/>
  </svg>`;
}
function renderMetricCards() {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  document.getElementById('met-grid').innerHTML = METRICS.map((m, i) => `
    <div class="met-card">
      <div class="label">${m.k[lang]}</div>
      <div class="value">${m.v}<span class="unit"></span></div>
      <div class="delta ${m.up ? 'up' : 'dn'}">${m.up ? '▲' : '▼'} ${m.d}</div>
      <div class="spark">${spark(m.trend, m.up ? 'var(--gold)' : 'var(--cyan)')}</div>
    </div>
  `).join('');
}
let curTrend = 0;
function renderTrend() {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  const tabs = document.getElementById('met-tabs');
  tabs.innerHTML = METRICS.slice(0, 6).map((m, i) =>
    `<button class="met-tab ${i === curTrend ? 'active' : ''}" data-i="${i}">${m.k[lang]}</button>`
  ).join('');
  tabs.querySelectorAll('.met-tab').forEach(b => b.onclick = () => { curTrend = +b.dataset.i; renderTrend(); });
  const m = METRICS[curTrend];
  const arr = m.trend;
  const max = Math.max(...arr), min = Math.min(...arr);
  const W = 800, H = 280, pad = 30;
  const xs = i => pad + (i / (arr.length - 1)) * (W - pad * 2);
  const ys = v => H - pad - ((v - min) / (max - min || 1)) * (H - pad * 2);
  const pts = arr.map((v, i) => `${xs(i)},${ys(v)}`).join(' ');
  const decades = Array.from({length: arr.length}, (_, i) => 1930 + i * 10);
  const grid = [0, .25, .5, .75, 1].map(p => {
    const y = pad + p * (H - pad * 2);
    return `<line x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}" stroke="rgba(123,92,255,.1)" />`;
  }).join('');
  const labels = decades.map((d, i) => `<text x="${xs(i)}" y="${H - 8}" text-anchor="middle" fill="#4d5172" font-size="10" font-family="JetBrains Mono">${d}</text>`).join('');
  document.getElementById('met-svg').innerHTML = `
    ${grid}
    <polyline fill="none" stroke="var(--plasma)" stroke-width="2.5" points="${pts}"/>
    <polyline fill="var(--plasma)" fill-opacity=".12" stroke="none" points="${pad},${H - pad} ${pts} ${W - pad},${H - pad}"/>
    ${arr.map((v, i) => `<circle cx="${xs(i)}" cy="${ys(v)}" r="3.5" fill="var(--cyan)"/>`).join('')}
    ${labels}
    <text x="${pad}" y="${pad - 8}" fill="#8b90b3" font-size="11" font-family="JetBrains Mono">${m.k[lang]} · ${(lang==='zh'?'1930→2020':'1930 → 2020')}</text>
  `;
}
renderMetricCards();
renderTrend();

/* ════════════════════════ MODULE 5 — STRATEGY ════════════════════════ */
let curStr = 'ubi';
function renderStrategyList() {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  document.getElementById('str-list').innerHTML = STRATEGIES.map(s => `
    <div class="str-item ${s.id === curStr ? 'active' : ''}" data-id="${s.id}">
      <div class="name">${s.name[lang]}</div>
      <div class="tag">${s.tag[lang].toUpperCase()}</div>
    </div>
  `).join('');
  document.querySelectorAll('.str-item').forEach(el => el.onclick = () => {
    curStr = el.dataset.id; renderStrategyList(); renderStrategyDetail(curStr);
  });
}
function renderStrategyDetail(id) {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  const s = STRATEGIES.find(x => x.id === id);
  const axisLabels = {
    short: {en:'Short-term Impact', zh:'短期冲击', c:'#ffd166'},
    long:  {en:'Long-term Stability', zh:'长期稳定', c:'#56e6ff'},
    ethics:{en:'Ethical Weight', zh:'伦理重量', c:'#7b5cff'},
    risk:  {en:'Fragility Risk', zh:'脆弱性风险', c:'#ff6b9d'},
  };
  const axesHtml = Object.entries(s.axes).map(([k, v]) => `
    <div class="str-axis">
      <div class="k">${axisLabels[k][lang]}</div>
      <div class="meter"><div style="width:${v}%;background:${axisLabels[k].c};"></div></div>
      <div class="scale"><span>${lang === 'zh' ? '低' : 'low'}</span><span>${v}</span><span>${lang === 'zh' ? '高' : 'high'}</span></div>
    </div>
  `).join('');
  const tradeoffs = (lang === 'zh' ? s.tradeoffs.zh : s.tradeoffs.en).map(t => `<li>${t}</li>`).join('');
  document.getElementById('str-detail').innerHTML = `
    <div class="name">${s.name[lang]}</div>
    <div class="summary">${s.summary[lang]}</div>
    <div class="str-axes">${axesHtml}</div>
    <div class="str-tradeoffs">
      <h5>${lang === 'zh' ? '你将继承的代价' : 'Tradeoffs you would inherit'}</h5>
      <ul>${tradeoffs}</ul>
    </div>
  `;
}
renderStrategyList();
renderStrategyDetail(curStr);

/* ════════════════════════ MODULE 6 — KNOWLEDGE LAYER ════════════════════════ */
let curLevel = 'beginner', curTopic = 'Time';
function renderKnowledge() {
  const lang = document.body.classList.contains('zh') ? 'zh' : 'en';
  document.getElementById('kl-tabs').innerHTML = KNOWLEDGE_LEVELS.map(l =>
    `<button class="kl-tab ${l.id === curLevel ? 'active' : ''}" data-l="${l.id}">${l.name[lang]}</button>`
  ).join('');
  document.getElementById('kl-topics').innerHTML = KNOWLEDGE_TOPICS.map((t, i) =>
    `<button class="kl-topic ${t === curTopic ? 'active' : ''}" data-t="${t}">${lang === 'zh' ? KNOWLEDGE_TOPICS_ZH[i] : t}</button>`
  ).join('');
  document.querySelectorAll('.kl-tab').forEach(b => b.onclick = () => { curLevel = b.dataset.l; renderKnowledge(); });
  document.querySelectorAll('.kl-topic').forEach(b => b.onclick = () => { curTopic = b.dataset.t; renderKnowledge(); });
  const idx = KNOWLEDGE_TOPICS.indexOf(curTopic);
  const topicLabel = lang === 'zh' ? KNOWLEDGE_TOPICS_ZH[idx] : curTopic;
  document.getElementById('kl-card').innerHTML = `
    <div class="topic">${(lang === 'zh' ? '主题 · ' : 'TOPIC · ') + topicLabel.toUpperCase()}</div>
    <h3>${KNOWLEDGE_LEVELS.find(l => l.id === curLevel).name[lang]}</h3>
    <div class="body">${KNOWLEDGE[curTopic][curLevel][lang]}</div>
  `;
}
renderKnowledge();

/* ════════════════════════ FADE-UP ANIMATIONS ════════════════════════ */
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), { threshold: .12 });
document.querySelectorAll('.section-head, .timeline-stage, .cs-stage, .sim-stage, .met-grid, .met-trend, .str-stage, .kl-stage').forEach(el => {
  el.classList.add('fadeup'); io.observe(el);
});
</script>
</body>
</html>
